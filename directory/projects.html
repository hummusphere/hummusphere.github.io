---
layout: default
title: Projects
permalink: /projects/
---


<div id="main-content" class="flex flex-col items-center">
    <div class="flex flex-row" style="font-size: 20px;">
        <h1 style="margin:10px">My</h1>
        <h1 style="margin: 10px; background: repeating-linear-gradient( 45deg, #00c853, #00c953 10px, #01c90a 10px, #18a21e 20px ); background-clip: border-box; -webkit-background-clip: text; color: transparent;""> Projects </h1>
    </div>
    <p style="margin-top:0px;"> A collection of things I have built, experimented with, and continue to improve. </p>
    <div id="proj-container" class="flex flex-row wrap justify-center">
        {% for project in site.projects %} 
        <a style="display:grid; grid-template-rows: 1fr 50px;" href="{{ project.url }}" class="proj">
            <div style="display: grid; grid-template-columns: 250px 1fr;">
                <div class="flex items-center justify-center">
                    <img class="proj-preview" src="{{ project.img }}" width="{{ project.width }}" height="{{ project.height }}"/>
                </div>
                <div style="margin-top: 15px;">
                    <h3 class="proj-header">{{ project.title }}</h3>
                    <p class="proj-description">
                        {{ project.desc }}
                    </p>
                </div>
            </div>
            <div class="flex flex-row justify-between items-center">
                <p style="color: var(--spring-green); margin:5px; margin-left: 20px; height: fit-content;"> View Documentation -></p>
                <div class="flex flex-row items-center" style="gap: 10px; margin-right: 20px;">
                    <p style="color: var(--spring-green); margin: 5px;"> View Source </p>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"></path>
                    </svg>
                </div>
            </div>
        </a>
        {% endfor %}
    </div>
</div>
